# Full stack: FastAPI + PostgreSQL + Redis + Celery
services:
  # FastAPI web application
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/pdf_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # volumes:
    #   - ./app:/app/app
    restart: unless-stopped
    networks:
      - app-network

  # Celery worker for background task processing
  celery-worker:
    build: .
    command: celery -A app.tasks.worker worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/pdf_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Celery Beat for scheduled/periodic tasks
  # celery-beat:
  #   build: .
  #   command: celery -A app.tasks.worker beat --loglevel=info
  #   environment:
  #     DATABASE_URL: postgresql://appuser:apppassword@postgres:5432/appdb
  #     REDIS_URL: redis://redis:6379/0
  #     CELERY_BROKER_URL: redis://redis:6379/0
  #     CELERY_RESULT_BACKEND: redis://redis:6379/1
  #   depends_on:
  #     - celery-worker
  #   restart: unless-stopped
  #   networks:
  #     - app-network

  # PostgreSQL database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pdf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pdf_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Redis as message broker and result backend
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Flower for monitoring Celery tasks (optional)
  flower:
    build: .
    command: celery -A app.tasks.worker flower --port=5555
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - celery-worker
    networks:
      - app-network

volumes:
  postgres-data:
  redis-data:

networks:
  app-network:
    driver: bridge